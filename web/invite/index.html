<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a group on xBill</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:#faf9f7; color:#1c1b1a; display:flex; min-height:100vh;
         align-items:center; justify-content:center; padding:24px; }
  @media (prefers-color-scheme: dark) { body { background:#141312; color:#f5f3f0; } }
  .card { max-width:420px; width:100%; text-align:center; background:#fff; border:1px solid #dad4c8;
          border-radius:24px; padding:40px 28px; }
  @media (prefers-color-scheme: dark) { .card { background:#1f1e1c; border-color:#33302c; } }
  h1 { font-size:24px; margin:0 0 8px; }
  p  { color:#6b6660; line-height:1.5; margin:0 0 20px; }
  .btn { display:inline-block; background:#43089f; color:#fff; text-decoration:none;
         padding:14px 28px; border-radius:12px; font-weight:600; }
  .secondary { display:block; margin-top:16px; color:#43089f; text-decoration:none; font-size:15px; }
  .muted { font-size:13px; color:#9f9b93; margin-top:24px; }
  code { background:rgba(0,0,0,.06); padding:3px 8px; border-radius:6px; font-size:13px; }
</style>
</head>
<body>
  <div class="card">
    <div style="font-size:56px; line-height:1">👥</div>
    <h1>You've been invited</h1>
    <p id="lead">Open this invite in xBill to join the group.</p>
    <a class="btn" id="open" href="#">Open in xBill</a>
    <a class="secondary" href="https://apps.apple.com/us/app/xbill/id6780284715">Don't have xBill? Get it free</a>
    <p class="muted" id="code"></p>
  </div>
<script>
  // The email links here rather than to xbill://join/<token> because a custom scheme has no
  // handler on a device without the app, and most mail clients will not linkify it. This page is
  // an ordinary https URL that always opens, then hands off to the app when it exists.
  var token = new URLSearchParams(location.search).get("token");
  var open  = document.getElementById("open");
  if (token) {
    open.href = "xbill://join/" + token;
    document.getElementById("code").innerHTML =
      "If the button does nothing, install xBill and open this link again.<br>Invite code: <code>" + token + "</code>";
  } else {
    open.style.display = "none";
    document.getElementById("lead").textContent =
      "This invite link is missing its code. Ask whoever invited you to send it again.";
  }
</script>
</body>
</html>
