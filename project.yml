name: xBill
options:
  bundleIdPrefix: com.vijaygoyal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.6"
    CURRENT_PROJECT_VERSION: "8"
    TARGETED_DEVICE_FAMILY: "1"        # iPhone only
    # Kept here so `xcodegen generate` does not wipe physical-device signing
    # out of project.pbxproj on every regeneration.
    DEVELOPMENT_TEAM: 7B5U5LACV3
    SUPPORTS_MAC_DESIGNED_FOR_IPAD: NO
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.43.1

targets:
  xBill:
    type: application
    platform: iOS
    sources:
      - path: xBill
        excludes:
          - "**/.DS_Store"
    resources:
      - path: xBill
        includes:
          - "**/*.xcassets"
          - "**/*.storyboard"
          - "**/*.xib"
          - "**/*.plist"
          - "**/*.xcprivacy"
    dependencies:
      - package: Supabase
        product: Supabase
      - target: xBillWidget
        embed: true
      # WIDGET-01. The **app** must embed this, even though the app does not use it.
      # `xBillWidget` links `@rpath/xBillWidgetCore.framework/xBillWidgetCore`, and an app
      # extension resolves frameworks through `@executable_path/../../Frameworks` — i.e. the
      # *host app's* Frameworks directory. Declaring it only as a dependency of the widget
      # links it without embedding it anywhere, so the bundle shipped with no Frameworks
      # directory at all and the extension died in dyld on every launch. iOS renders a blank
      # placeholder for a crashed widget, which is why this read as "no data" rather than as
      # a crash. Broken since the 2026-07-15 widget-core split and shipped in v1.0.
      - target: xBillWidgetCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vijaygoyal.xbill
        INFOPLIST_FILE: xBill/Info.plist
        # Must be set HERE, not only in the project-level `settings.base` above: xcodegen
        # writes its own per-target default of "1,2" for an iOS application, which overrides
        # the project-level value. The widget targets already set it explicitly and were
        # correct; the app target did not, so the shipped bundle declared UIDeviceFamily
        # [1,2] — iPad support the app was never designed for. App Store Connect then applied
        # iPad multitasking rules and rejected the upload with error 90474.
        TARGETED_DEVICE_FAMILY: "1"        # iPhone only
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          CODE_SIGN_ENTITLEMENTS: xBill/xBill.Debug.entitlements
          DEBUG_INFORMATION_FORMAT: dwarf
          GCC_GENERATE_DEBUGGING_SYMBOLS: YES
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          VALIDATE_PRODUCT: YES
          CODE_SIGN_ENTITLEMENTS: xBill/xBill.entitlements
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          # Must be YES, despite L4 setting it to NO as a hardening measure. It contradicted
          # `dwarf-with-dsym`: with no symbols generated there is nothing to put in the dSYM, so
          # the archive shipped without one and App Store Connect rejected it ("did not include a
          # dSYM ... with the UUIDs"). It also bought no security — `STRIP_INSTALLED_PRODUCT = YES`
          # already strips symbols from the shipped binary, and the .dSYM is a separate artefact
          # that is never delivered to users. What it did cost is symbolicated crash reports.
          GCC_GENERATE_DEBUGGING_SYMBOLS: YES

  xBillWidgetCore:
    type: framework
    platform: iOS
    sources:
      - path: xBillWidgetCore
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vijaygoyal.xbill.widgetcore
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        ENABLE_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  xBillWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: xBillWidget
        excludes:
          - "**/.DS_Store"
          - "**/*.plist"
          - "**/*.entitlements"
    resources:
      - path: xBillWidget
        includes:
          - "**/*.plist"
          - "**/*.xcprivacy"
    dependencies:
      - target: xBillWidgetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vijaygoyal.xbill.widget
        INFOPLIST_FILE: xBillWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        ENABLE_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: "8"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: xBillWidget/xBillWidget.entitlements
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  xBillTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: xBillTests
        excludes:
          - "ReceiptCorpus/**"
    dependencies:
      - target: xBill
    postCompileScripts:
      # The receipt benchmark corpus travels INSIDE the test bundle so the suite can run on a
      # physical device, which cannot read the Mac's filesystem. Copied rather than declared as a
      # resource because the folder is git-ignored (real receipts carry card digits) and a missing
      # declared resource fails the build for anyone who does not have it.
      - name: Copy receipt corpus (optional)
        script: |
          # Only a DEVICE needs the corpus inside the bundle. A simulator test can read the
          # source tree directly via #filePath, and copying into the .xctest here runs AFTER the
          # app is signed — which invalidates the signature and makes the simulator refuse to
          # launch the app at all ("RequestDenied by SBMainWorkspace"). That broke every
          # simulator benchmark run until it was traced back here.
          if [ "$PLATFORM_NAME" != "iphoneos" ]; then
            echo "note: $PLATFORM_NAME build — benchmark reads the corpus from the source tree"
            exit 0
          fi
          SRC="$SRCROOT/xBillTests/ReceiptCorpus"
          if [ ! -d "$SRC" ]; then
            echo "note: no receipt corpus present; benchmark will report nothing to measure"
            exit 0
          fi
          # TARGET_BUILD_DIR, not BUILT_PRODUCTS_DIR. For a test bundle with a host app the two
          # differ: BUILT_PRODUCTS_DIR is the standalone .xctest, while the bundle that actually
          # runs is the copy embedded at $TARGET_BUILD_DIR (xBill.app/PlugIns/). Writing to the
          # former put 22 images somewhere nothing ever loaded, and the benchmark reported "no
          # corpus" while the build log said it had bundled one.
          for BASE in "$TARGET_BUILD_DIR" "$BUILT_PRODUCTS_DIR"; do
            DEST="$BASE/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ReceiptCorpus"
            rm -rf "$DEST"; mkdir -p "$DEST"
            cp -R "$SRC/images" "$SRC/labels" "$DEST/"
          done
          echo "note: bundled receipt corpus ($(ls "$SRC/images" | wc -l | tr -d ' ') images) into $TARGET_BUILD_DIR"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vijaygoyal.xbill.tests
        GENERATE_INFOPLIST_FILE: YES

  xBillWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: xBillWidgetTests
    dependencies:
      - target: xBillWidgetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vijaygoyal.xbill.widget.tests
        GENERATE_INFOPLIST_FILE: YES

  xBillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: xBillUITests
        excludes:
          - "Info.plist"
          - "UITestCredentials.plist"
          - "Generated/**"
    dependencies:
      - target: xBill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vijaygoyal.xbill.uitests
        INFOPLIST_FILE: xBillUITests/Info.plist
        GENERATE_INFOPLIST_FILE: NO

schemes:
  xBill:
    build:
      targets:
        xBill: all
        xBillWidgetCore: all
        xBillWidget: all
        xBillTests: [test]
        xBillWidgetTests: [test]
        xBillUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: xBillTests
          parallelizable: true
          randomExecutionOrder: true
        - name: xBillWidgetTests
        - name: xBillUITests
    profile:
      config: Release
    archive:
      config: Release
